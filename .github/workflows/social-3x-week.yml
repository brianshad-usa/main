name: Social Posts (3x/week)

on:
  schedule:
    # Mon, Wed, Fri at 17:00 UTC = 10 AM Los Angeles (PDT) / 9 AM (PST)
    - cron: '0 17 * * 1,3,5'
  workflow_dispatch:
    inputs:
      idea:
        description: 'Backlog idea id (e.g. S031) to force; blank = engine selects'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic pillow

      # content_studio: backlog selection -> draft -> internal review board ->
      # excellence gate (<90 fails the run: publishing nothing beats filler) ->
      # carousel + card render -> pending.json manifest + ledger entry.
      - name: Editorial engine (select, write, review, render)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.idea }}" ]; then
            python content_studio.py --idea "${{ github.event.inputs.idea }}"
          else
            python content_studio.py
          fi

      - name: Commit + push images and ledger
        run: |
          git config user.name "ProLink Social Bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/ editorial/ledger.json editorial/manifests/
          if git diff --cached --quiet; then
            echo "No new content to commit."
          else
            git commit -m "Editorial content $(date -u +%F)"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "Pushed on attempt $attempt."; break
              fi
              echo "Push attempt $attempt failed; retrying..."; sleep 5
            done
            echo "Waiting for raw URL to propagate..."; sleep 15
          fi

      - name: Publish to channels (LinkedIn, GBP, Instagram, Facebook)
        env:
          GBP_CLIENT_ID:          ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:      ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN:      ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID:         ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID:        ${{ secrets.GBP_LOCATION_ID }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID:        ${{ secrets.LINKEDIN_ORG_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:        ${{ secrets.X_ACCESS_SECRET }}
        run: python social_publish.py
