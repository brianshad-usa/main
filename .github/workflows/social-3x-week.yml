name: Social Posts (Daily)

on:
  schedule:
    # Daily at 17:00 UTC = 10 AM Los Angeles (PDT) / 9 AM (PST).
    # Backlog verified deep enough to sustain daily at quality: 258 curated
    # ideas (all composite >= 8.07/10), 182-day per-idea cooldown; a full-year
    # daily simulation ran 0 starved days with ~69 ideas still in reserve. The
    # 90-score excellence gate still governs each post independently, so a weak
    # generation skips that day rather than shipping filler.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      idea:
        description: 'Backlog idea id (e.g. S031) to force; blank = engine selects'
        required: false
        default: ''

permissions:
  contents: write

# Serialize production runs so two Actions can never mint the same slot: a queued
# run only starts after the running one has persisted the advanced ledger, and
# will therefore select the NEXT idea rather than a duplicate.
concurrency:
  group: social-daily-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The pipeline NO LONGER depends on pushing to protected 'main'. State (card
  # images + dedup ledger) is persisted to the non-protected 'social-state'
  # branch, and the URL-fetch channels (GBP/Instagram/Facebook) read the card
  # image from THAT branch. A dedicated state branch is the cleanest of the
  # resilient options: one mechanism hosts the images AND carries the ledger,
  # with no bypass token or protected-main push required.
  STATE_BRANCH: social-state
  SOCIAL_IMG_BASE: https://raw.githubusercontent.com/brianshad-usa/main/social-state/social/

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic pillow

      # --- DEDUP STATE IN (belt-and-suspenders) ---------------------------
      # Restore the ledger from the Actions cache as a SECONDARY durable store,
      # so one-post-per-idea dedup survives even if the social-state branch push
      # were ever rejected too. The branch copy (fetched below) is the primary.
      - name: Restore dedup ledger cache
        id: ledgercache
        uses: actions/cache/restore@v4
        with:
          path: .ledger-cache/ledger.json
          key: social-ledger-${{ github.run_id }}
          restore-keys: |
            social-ledger-

      # Choose the MOST-ADVANCED ledger (most posts = newest, append-only log)
      # among: the social-state branch, the Actions cache, and the repo copy.
      # Whichever persisted last wins, so a re-selected duplicate is impossible
      # as long as ANY one of the three survived.
      - name: Reconcile dedup ledger
        run: |
          git fetch --quiet origin "$STATE_BRANCH" 2>/dev/null || true
          mkdir -p .ledger-branch .ledger-cache
          if git cat-file -e "origin/$STATE_BRANCH:editorial/ledger.json" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:editorial/ledger.json" > .ledger-branch/ledger.json
            echo "Fetched ledger from $STATE_BRANCH."
          else
            echo "No $STATE_BRANCH ledger yet (first run or branch absent)."
          fi
          python ledger_sync.py restore \
            .ledger-branch/ledger.json \
            .ledger-cache/ledger.json \
            editorial/ledger.json

      # content_studio: backlog selection -> draft -> internal review board ->
      # excellence gate (<90 fails the run: publishing nothing beats filler) ->
      # carousel + card render -> pending.json manifest + ledger entry.
      - name: Editorial engine (select, write, review, render)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Marks this as THE authoritative slot producer. Only a run with this
          # set writes real social/ + editorial/manifests/ files and advances the
          # ledger. Local/dev runs lack it and render to gitignored scratch/.
          CONTENT_STUDIO_ENV: production
        run: |
          if [ -n "${{ github.event.inputs.idea }}" ]; then
            python content_studio.py --idea "${{ github.event.inputs.idea }}"
          else
            python content_studio.py
          fi

      # --- DEDUP + IMAGE STATE OUT (primary) ------------------------------
      # Persist images + ledger + manifests to the non-protected social-state
      # branch. BEST-EFFORT by design (the script always exits 0): a failure to
      # persist logs a ::warning:: but must NEVER fail the run or stop posting.
      # This runs BEFORE publishing so the card image is live at the raw URL that
      # GBP/Instagram/Facebook fetch.
      - name: Persist state to social-state branch (best-effort)
        run: bash persist_state.sh

      # Stage the advanced ledger for the cache save below.
      - name: Stage ledger for cache
        if: always()
        run: |
          mkdir -p .ledger-cache
          [ -f editorial/ledger.json ] && cp -a editorial/ledger.json .ledger-cache/ledger.json || true

      - name: Save dedup ledger cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ledger-cache/ledger.json
          key: social-ledger-${{ github.run_id }}

      # --- PUBLISH (this step's success IS the run's success) -------------
      # Posting is what the green check must mean. The card image is read from
      # the social-state raw URL (SOCIAL_IMG_BASE, set in env above); each
      # URL-fetch channel is pre-flighted for HTTP 200 inside social_publish.py,
      # and LinkedIn uploads the local file so it posts regardless of the URL.
      - name: Publish to channels (LinkedIn, GBP, Instagram, Facebook)
        env:
          GBP_CLIENT_ID:          ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:      ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN:      ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID:         ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID:        ${{ secrets.GBP_LOCATION_ID }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID:        ${{ secrets.LINKEDIN_ORG_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          # Facebook-login flow: set the IG_GRAPH_BASE secret to
          # https://graph.facebook.com/v21.0 so IG publishing uses the Page/
          # linked-IG token. If unset, instagram_post.py defaults to
          # graph.instagram.com (the Instagram-login flow).
          IG_GRAPH_BASE:          ${{ secrets.IG_GRAPH_BASE }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:        ${{ secrets.X_ACCESS_SECRET }}
          # X posting is manual for now (API paywalled). To arm the automated
          # channel later: create the repo Actions VARIABLE X_ENABLED = 1.
          X_ENABLED:              ${{ vars.X_ENABLED }}
        run: python social_publish.py

      # --- OPTIONAL: restore the clean state commit on main ---------------
      # Cosmetic mirror so humans browsing 'main' see current images/ledger.
      # Fully non-fatal: posting + dedup already succeeded above. While the
      # 'main-protection' ruleset blocks the Actions bot this will warn and move
      # on. Add 'GitHub Actions' to that ruleset's bypass list to make it clean.
      - name: Mirror state to main (best-effort, optional)
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "ProLink Social Bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/ editorial/ledger.json editorial/manifests/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to mirror to main."
            exit 0
          fi
          git commit --quiet -m "Editorial content $(date -u +%F)" || exit 0
          if git pull --rebase --autostash origin main && git push origin HEAD:main; then
            echo "Mirrored state commit to main."
          else
            echo "::warning::Could not mirror to main (expected while the 'main-protection' ruleset blocks the Actions bot's push). This is COSMETIC ONLY -- posting and dedup already succeeded via the '$STATE_BRANCH' branch and the ledger cache. To restore clean pushes to main, add 'GitHub Actions' to the main-protection ruleset's Bypass list: Settings -> Rules -> Rulesets -> main-protection -> Bypass list -> Add bypass -> GitHub Actions."
          fi
