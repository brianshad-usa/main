name: Generate Blog Post

on:
  schedule:
    # Every other day at 16:00 UTC = ~9 AM Los Angeles (8 AM PST / 9 AM PDT),
    # a strong window for LinkedIn engagement. Temporary high-frequency cadence;
    # revert to '0 16 1 * *' for once-a-month.
    - cron: '0 16 */2 * *'
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Topic index (0-94). Leave empty for auto-rotation.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic beautifulsoup4

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_INDEX: ${{ github.event.inputs.topic_index }}
          # LinkedIn auto-post (see LINKEDIN_SETUP.md). If these are unset the
          # blog still publishes normally -- the LinkedIn step just no-ops.
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_API_VERSION: ${{ secrets.LINKEDIN_API_VERSION }}
        run: python generate_blog.py

      - name: Site guard (block publish on any site-wide violation)
        # beautifulsoup4 is already installed in "Install dependencies" above.
        # A non-zero exit here fails the job, so a bad post is never committed.
        run: python site_guard.py

      - name: Commit and push
        run: |
          git config --global user.name "ProLink Blog Bot"
          git config --global user.email "blog-bot@prolinksystems.com"
          git add blog/ sitemap.xml index.html used_topics.json
          if git diff --staged --quiet; then
            echo "Nothing to commit; skipping push."
            exit 0
          fi
          git commit -m "Auto-generate blog post $(date +'%Y-%m-%d')"
          # Push with rebase-and-retry. The blog generation step takes ~3 minutes,
          # during which other jobs (the social pipeline, editorial auto-commits,
          # the local auto-commit watcher) frequently push to main. A bare
          # "git push" then loses the race with "! [rejected] (fetch first)" and
          # fails the whole run even though the post generated fine (see run #74).
          # Rebase our single commit onto the latest main and retry a few times.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent push); retrying in 5s..."
            sleep 5
          done
          echo "::error::Failed to push the generated blog post after 5 attempts."
          exit 1
